<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <!-- Metadatos SEO optimizados -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="description" content="Editor avanzado para scripts de Minecraft Bedrock con autocompletado en TS/JS. Optimizado para rendimiento." />
    <meta property="og:title" content="MCBEDITOR v1.4 (Optimizado)" />
    <meta property="og:image" content="https://raw.githubusercontent.com/ajr-uribe/bedrock-script-editor-mobile/refs/heads/editor-v1.4/icons/icon-192.webp" />
    <meta property="og:url" content="https://mcbeditor.vercel.app" />
    <meta name="theme-color" content="#2b2f34" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="./icons/favicon.png" />
    <title>MCBEDITOR v1.4 (TS/JS Optimizado)</title>

    <!-- Precarga de recursos críticos -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js" as="script" crossorigin />
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.nls.js" as="script" crossorigin />
    
    <!-- FontAwesome SVG (carga diferida) -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" as="script" />
    
    <!-- CSS crítico inline (opcional para LCP) -->
    <style>
        #app { 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            background: #1e1e1e; 
        }
        #editor-container { 
            flex: 1; 
            position: relative; 
        }
        #monaco-editor { 
            position: absolute; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
        }
        .status-bar { 
            padding: 8px; 
            background: #252526; 
            color: #ccc; 
            font-family: sans-serif; 
        }
    </style>
    <link rel="stylesheet" href="styles.css" media="print" onload="this.media='all'" />
</head>
<body>
    <main id="app" role="main">
        <header id="header">
            <h1>
                <img src="./icons/icon-192.webp" alt="MCBE Editor" width="32" height="32" loading="lazy" />
                Bedrock Scripts Editor
            </h1>
            <div id="toolbar" role="toolbar">
                <!-- Toolbar existente (optimizado en JS) -->
            </div>
        </header>

        <section id="editor-container">
            <!-- Placeholder para CLS 0 -->
            <div id="editor-loading" style="height:100%; display:flex; align-items:center; justify-content:center; background:#1e1e1e; color:#ccc;">
                <p>Cargando editor Monaco...</p>
            </div>
            <div id="monaco-editor" style="display:none;"></div>
        </section>

        <div class="status-bar">
            <span id="status-text">Cargando...</span>
            <span id="save-status" aria-live="polite"></span>
        </div>
    </main>

    <!-- Toast accesible (mejorado) -->
    <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" hidden></div>

    <!-- Monaco Editor - Carga optimizada -->
    <script>
        // Estrategia de carga progresiva
        function initMonaco() {
            const startTime = performance.now();
            
            require.config({
                paths: { 
                    vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs'
                },
                ignoreDuplicateModules: true,
                waitSeconds: 10
            });

            // Solo carga lo esencial para TS/JS
            require([
                'vs/editor/editor.main',
                'vs/language/typescript/tsMode',
                'vs/language/javascript/javascriptMode',
                'vs/basic-languages/typescript/typescript',
                'vs/basic-languages/javascript/javascript'
            ], () => {
                // Configuración óptima para TS
                monaco.languages.typescript.typescriptDefaults.setCompilerOptions({
                    target: monaco.languages.typescript.ScriptTarget.ES2020,
                    module: monaco.languages.typescript.ModuleKind.ESNext,
                    allowNonTsExtensions: true,
                    lib: ['es2020']
                });

                const editor = monaco.editor.create(document.getElementById('monaco-editor'), {
                    value: localStorage.getItem('editor-content') || '// Escribe tu código aquí\n',
                    language: 'typescript',
                    theme: 'vs-dark',
                    automaticLayout: true,
                    minimap: { enabled: false },
                    scrollBeyondLastLine: false,
                    fontSize: 14,
                    renderWhitespace: 'none',
                    lineNumbers: 'on',
                    roundedSelection: true,
                    padding: { top: 10 }
                });

                // UI Finalizada
                document.getElementById('editor-loading').style.display = 'none';
                document.getElementById('monaco-editor').style.display = 'block';
                document.getElementById('status-text').textContent = `Editor listo en ${(performance.now() - startTime).toFixed(0)}ms`;

                // Guardar contenido automáticamente
                editor.getModel().onDidChangeContent(() => {
                    localStorage.setItem('editor-content', editor.getValue());
                });
            });
        }

        // Carga diferida con priorización
        if ('requestIdleCallback' in window) {
            window.requestIdleCallback(() => {
                loadMonacoScript();
            }, { timeout: 2000 });
        } else {
            window.addEventListener('load', loadMonacoScript);
        }

        function loadMonacoScript() {
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js';
            script.onload = initMonaco;
            script.onerror = () => {
                document.getElementById('status-text').textContent = 'Error al cargar el editor';
            };
            document.body.appendChild(script);
        }
    </script>

    <!-- Main.js como módulo (carga diferida) -->
    <script defer src="/js/main.js" type="module"></script>

    <!-- FontAwesome (carga diferida después de interactividad) -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const faScript = document.createElement('script');
            faScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js';
            faScript.defer = true;
            document.body.appendChild(faScript);
        });
    </script>
</body>
</html>
