<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="MCBE Script Editor">
    <meta property="og:description" content="Minecraft bedrock Editor for easily making Scripts with auto-completions">
    <meta property="og:image" content="https://res.cloudinary.com/dchi3dtvc/image/upload/favicon_xngegt.png">
    <meta property="og:url" content="https://ajr-uribe-editor.vercel.app?v2"> 
    <meta property="og:type" content="website"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="./icons/favicon.png">
    <meta name="theme-color" content="#007acc">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MCBE Scripts Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 300ms ease;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            overflow: wrap;
        }
        h1 {
            font-size: 30px;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        #header {
            padding: 15px;
            background: #252526;
            border-bottom: 1px solid #333;
            position: relative;
            z-index: 2;
        }
        #toolbar {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 10px;
        }
        select, button {
            padding: 5px 10px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
        button:disabled {
            opacity: 0.7;
            cursor: default;
            background: #333 !important;
        }
        #editor-container {
            flex: 1;
            position: relative;
            min-height: 300px;
        }
        #monaco-editor {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            overflow: hidden;
        }
        .status-bar {
            padding: 5px 15px;
            background: #007acc;
            font-size: 12px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            z-index: 1000;
            display: none;
        }
        #icon {
            max-height: 40px;
            vertical-align: middle;
            margin-right: 10px;
        }
        @media (min-width: 1200px) {
            #header {
                height: auto;
                padding: 20px;
            }
            h1 {
                font-size: 2.5rem;
                margin-bottom: 20px;
            }
            #module-select, #run-btn, #copy-btn {
                font-size: 1rem;
                padding: 8px 15px;
            }
            #icon {
                max-height: 90px;
            }
        }
        @media (max-width: 660px) {
            #icon {
                max-height: 30px;
            }
            h1 {
                font-size: 1.2rem;
            }
            /* Estilos para el botón de instalación */
            #install-btn {
                position: fixed;
                top: 15px;
                right: 15px;
            }
            #install-btn.available {
                background-color: #4CAF50; /* Verde */
                color: white;
            }
            #install-btn.installed {
                background-color: #9E9E9E; /* Gris */
                cursor: default;
                opacity: 0.5;
            }
    </style>
</head>
<body>
    <div id="app">
        <div id="header">
            <h1><img src="./icons/favicon.png" id="icon">Bedrock Scripts Editor</h1>
            <div id="toolbar">
                <select id="module-select">
                    <option value="server">@minecraft/server</option>
                    <option value="server-ui">@minecraft/server-ui</option>
                    <option value="server-gametest">@minecraft/server-gametest</option>
                </select>
                <button id="run-btn">Execute (Soon)</button>
                <button id="copy-btn">Copy</button>
                <button id="install-btn" onclick="InstallApp()">Install</button>
            </div>
        </div>
        <div id="editor-container">
            <div id="monaco-editor"></div>
        </div>
        <div class="status-bar" id="status-bar">
            Loading editor...
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs/loader.min.js"></script>
<script>
    // 1. CONFIGURACIÓN MONACO EDITOR (OFFLINE)
    require.config({
        paths: {
            'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs'
        },
        waitSeconds: 30
    });

    // Configuración offline para workers
    window.MonacoEnvironment = {
        getWorkerUrl: function(moduleId, label) {
            const workerUrl = `data:text/javascript;base64,${btoa(`
                self.MonacoEnvironment = {
                    baseUrl: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/'
                };
                try {
                    importScripts('vs/base/worker/workerMain.js');
                } catch(e) {
                    // Fallback para offline
                    const cacheFallback = caches.match('https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs/base/worker/workerMain.js');
                    if (cacheFallback) {
                        importScripts(cacheFallback);
                    }
                }
            `)}`;
            return workerUrl;
        }
    };

    // 2. VARIABLES GLOBALES
    let deferredPrompt;
    let editor;
    const CACHE_NAME = 'mcbe-offline-v4';

    // 3. EJEMPLOS DE CÓDIGO (igual que antes)
    const EXAMPLES = {
        server: `// @minecraft/server example...`, 
        'server-ui': `// @minecraft/server-ui example...`,
        'server-gametest': `// @minecraft/server-gametest example...`
    };

    // 4. SISTEMA DE INSTALACIÓN (BOTÓN VERDE/GRIS)
    function updateInstallButton() {
        const installBtn = document.getElementById('install-btn');
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
        
        if (isStandalone) {
            installBtn.classList.add('installed');
            installBtn.classList.remove('available');
            installBtn.textContent = "Instalada";
            installBtn.disabled = true;
        } else if (deferredPrompt) {
            installBtn.classList.add('available');
            installBtn.classList.remove('installed');
            installBtn.textContent = "Instalar";
            installBtn.disabled = false;
        } else {
            installBtn.classList.remove('available', 'installed');
            installBtn.textContent = "Instalar";
            installBtn.disabled = false;
        }
    }

    function InstallApp() {
        if (window.matchMedia('(display-mode: standalone)').matches) {
            showToast('La app ya está instalada', false);
            return;
        }

        if (deferredPrompt) {
            deferredPrompt.prompt().then(() => deferredPrompt.userChoice)
                .then((choice) => {
                    if (choice.outcome === 'accepted') {
                        showToast('¡App instalada!', false);
                    }
                    deferredPrompt = null;
                    updateInstallButton();
                })
                .catch((err) => {
                    console.error("Error al instalar:", err);
                    showToast('Usa el menú del navegador', false);
                });
        }
    }

    // 5. FUNCIONES OFFLINE
    async function cacheResources() {
        const resources = [
            '/',
            '/index.html',
            '/manifest.json',
            '/icons/favicon.png',
            'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs/loader.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs/base/worker/workerMain.js',
            'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs/editor/editor.main.js',
            '/types/@minecraft/server/index.d.ts',
            '/types/@minecraft/server-ui/index.d.ts',
            '/types/@minecraft/server-gametest/index.d.ts'
        ];

        const cache = await caches.open(CACHE_NAME);
        await cache.addAll(resources);
    }

    function setupOfflineFallbacks() {
        caches.match('/').then(response => {
            if (!response) cacheResources();
        });
    }

    // 6. FUNCIONES DEL EDITOR
    function createEditor() {
        if (editor) editor.dispose();

        editor = monaco.editor.create(document.getElementById('monaco-editor'), {
            value: EXAMPLES.server,
            language: 'javascript',
            theme: 'vs-dark',
            automaticLayout: true,
            minimap: { enabled: true },
            fontSize: 16,
            lineHeight: 24
        });

        // Verificar recursos offline
        setupOfflineFallbacks();
    }

    async function loadTypeDefinitions() {
        try {
            const [serverTypes, serverUiTypes, gameTestTypes] = await Promise.all([
                fetch('/types/@minecraft/server/index.d.ts').catch(() => 
                    caches.match('/types/@minecraft/server/index.d.ts')
                ),
                fetch('/types/@minecraft/server-ui/index.d.ts').catch(() => 
                    caches.match('/types/@minecraft/server-ui/index.d.ts')
                ),
                fetch('/types/@minecraft/server-gametest/index.d.ts').catch(() => 
                    caches.match('/types/@minecraft/server-gametest/index.d.ts')
                )
            ]);

            // Configuración de tipos...
        } catch (error) {
            console.error("Error cargando tipos:", error);
            showToast('Error loading API definitions', true);
        }
    }

    // 7. FUNCIONES AUXILIARES
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.backgroundColor = isError ? '#d32f2f' : '#007acc';
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    // 8. INICIALIZACIÓN
    async function initializeApp() {
        try {
            // Service Worker
            if ('serviceWorker' in navigator) {
                await navigator.serviceWorker.register('/sw.js');
                setupOfflineFallbacks();
            }

            // Monaco Editor
            await new Promise((resolve) => {
                require(['vs/editor/editor.main'], resolve);
            });

            createEditor();
            await loadTypeDefinitions();

            // Eventos
            editor.onDidChangeModelContent(updateStatusBar);
            document.getElementById('copy-btn').addEventListener('click', copyScript);

        } catch (error) {
            console.error("Error inicializando:", error);
            showToast('Failed to initialize', true);
        }
    }

    // 9. EVENTOS GLOBALES
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        updateInstallButton();
    });

    window.addEventListener('appinstalled', () => {
        showToast('¡App instalada!');
        updateInstallButton();
    });

    window.addEventListener('DOMContentLoaded', () => {
        updateInstallButton();
        initializeApp();
    });

    // 10. VERIFICACIÓN OFFLINE (DEBUG)
    function checkOfflineSupport() {
        if (!navigator.onLine) {
            showToast('Modo offline activado');
            caches.has(CACHE_NAME).then(hasCache => {
                console.log('Cache disponible:', hasCache);
            });
        }
    }
    window.addEventListener('offline', checkOfflineSupport);
</script>
</body>
</html>
