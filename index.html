<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta property="twitter:image" content="https://raw.githubusercontent.com/ajr-uribe/bedrock-script-editor-mobile/refs/heads/editor-v1.4/icons/icon-192.webp" />
    <meta property="og:title" content="MCBEDITOR v1.4" />
    <meta property="og:site_name" content="MCBEDITOR v1.4" />
    <meta property="og:description" content="Editor avanzado para scripts de Minecraft Bedrock con autocompletado y carga de tipos dinámica. Recibe actualizaciones constantemente y sigue en desarrollo por: a.j.r._.uribe" />
    <meta property="twitter:description" content="Editor avanzado para scripts de Minecraft Bedrock con autocompletado y carga de tipos dinámica. Recibe actualizaciones constantemente y sigue en desarrollo por: a.j.r._.uribe" />
    <meta property="description" content="Editor avanzado para scripts de Minecraft Bedrock con autocompletado y carga de tipos dinámica. Recibe actualizaciones constantemente y sigue en desarrollo por: a.j.r._.uribe" />
    <meta name="description" content="Editor avanzado para scripts de Minecraft Bedrock con autocompletado y carga de tipos dinámica. Recibe actualizaciones constantemente y sigue en desarrollo por: a.j.r._.uribe" />
    <meta property="og:image" content="https://raw.githubusercontent.com/ajr-uribe/bedrock-script-editor-mobile/refs/heads/editor-v1.4/icons/icon-192.webp" />
    <meta property="twitter:title" content="MCBEDITOR" />
    <meta property="og:url" content="https://mcbeditor.vercel.app" />
    <meta property="og:type" content="website" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="./icons/favicon.png" />
    <!-- Versión SVG Fontawesome  -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <meta name="theme-color" content="#2b2f34" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MCBEDITOR v1.4</title>
    
    <!-- Estilos para pantalla de carga -->
    <style>
        #initial-loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #007acc;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 15px;
            font-size: 1.2em;
        }
        
        #app {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .app-loaded #app {
            opacity: 1;
        }
        
        .app-loaded #initial-loading-overlay {
            display: none;
        }
    </style>
    
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Pantalla de carga inicial -->
    <div id="initial-loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Iniciando MCBEDITOR...</div>
    </div>

    <!-- Tu aplicación (oculta inicialmente) -->
    <main id="app" role="main" aria-label="Editor principal">
        <header id="header">
            <h1>
                <img src="./icons/icon-192.webp" alt="MCBE Editor logo" id="icon" />
                Bedrock Scripts Editor
            </h1>
            <div id="toolbar" role="region" aria-label="Barra de herramientas">
                <select id="module-select" aria-label="Seleccionar módulo">
                    <option value="server">@minecraft/server</option>
                    <option value="server-ui">@minecraft/server-ui</option>
                    <option value="server-gametest">@minecraft/server-gametest</option>
                </select>

                <input id="version-input" type="text" placeholder="ej. 1.0.0" value="1.0.0"
                    aria-label="Versión del módulo" pattern="\d+\.\d+\.\d+" title="Formato X.X.X" />

                <button id="load-types-btn" aria-label="Cargar definiciones de tipos">
                    <i class="fas fa-code"></i> Cargar Tipos
                </button>

                <input type="text" id="filename-input" placeholder="Nombre archivo" value="main"
                    aria-label="Nombre del archivo" maxlength="50" />

                <button id="copy-btn" aria-label="Copiar código">
                    <i class="far fa-copy"></i> Copiar
                </button>

                <button id="download-btn" aria-label="Descargar código">
                    <i class="fas fa-download"></i> Descargar
                </button>

                <button id="install-btn" aria-label="Instalar aplicación" style="display: none">
                    <i class="fas fa-download"></i> Instalar App
                </button>

                <button id="reset-btn" aria-label="Resetear editor">
                    <i class="fas fa-trash-alt"></i> Reiniciar
                </button>
            </div>
        </header>

        <section id="editor-container">
            <div id="monaco-editor" aria-label="Editor de código"></div>
        </section>

        <div class="status-bar" id="status-bar" aria-live="polite" aria-atomic="true">
            Cargando editor...
            <div id="save-status" class="save-status" role="status" aria-live="polite">
                <i class="fas fa-save"></i> Guardado
            </div>
        </div>
    </main>

    <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

    <!-- Configuración e inicialización -->
    <script>
        // Configuración global para Monaco
        window.monacoConfig = {
            loaderUrl: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js',
            baseUrl: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs',
            onReady: function() {
                // Cuando todo esté listo
                document.body.classList.add('app-loaded');
                
                // Actualizar estado
                const statusBar = document.getElementById('status-bar');
                if (statusBar) {
                    statusBar.textContent = 'Editor listo';
                }
            },
            onError: function(error) {
                console.error('Error loading Monaco:', error);
                document.getElementById('initial-loading-overlay').innerHTML = `
                    <div style="color: #ff4444; text-align: center;">
                        <p>Error al cargar el editor</p>
                        <button onclick="window.location.reload()" 
                                style="margin-top: 20px; padding: 10px 20px; background: #007acc; color: white; border: none; border-radius: 4px;">
                            Reintentar
                        </button>
                    </div>
                `;
            }
        };

        // Carga diferida del script principal
        document.addEventListener('DOMContentLoaded', function() {
            const script = document.createElement('script');
            script.src = '/js/main.js';
            script.type = 'module';
            script.defer = true;
            
            script.onload = function() {
                if (window.monacoConfig.onReady) {
                    window.monacoConfig.onReady();
                }
            };
            
            script.onerror = function() {
                if (window.monacoConfig.onError) {
                    window.monacoConfig.onError(new Error('Error loading main.js'));
                }
            };
            
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
