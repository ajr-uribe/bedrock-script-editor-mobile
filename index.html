<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MCBE Script Editor</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <div id="app">
    <header id="header">
      <h1>MCBE Script Editor</h1>

      <div id="toolbar">
        <select id="module-select" data-last-value="server" aria-label="Seleccionar módulo">
          <option value="server">@minecraft/server</option>
          <option value="server-ui">@minecraft/server-ui</option>
          <option value="server-gametest">@minecraft/server-gametest</option>
        </select>

        <input
          type="text"
          id="module-version"
          placeholder="Versión (ej. 2.0.0)"
          aria-label="Versión del módulo"
          style="width: 100px; padding: 5px; border-radius: 4px; border: 1px solid #555; background: #333; color: #d4d4d4;"
        />

        <button id="load-types-btn" title="Cargar tipos de módulo dinámicamente">Cargar tipos</button>

        <input type="text" id="filename-input" placeholder="Nombre archivo" aria-label="Nombre del archivo" />

        <button id="copy-btn" title="Copiar código al portapapeles">Copiar</button>
        <button id="download-btn" title="Descargar archivo .js">Descargar</button>
        <button id="reset-btn" title="Reiniciar editor">Reiniciar</button>
        <button id="install-btn" title="Instalar aplicación PWA" disabled>Instalar</button>
      </div>
    </header>

    <div id="editor-container">
      <div id="monaco-editor" role="main" aria-label="Editor de código"></div>
    </div>

    <div class="status-bar" id="status-bar" aria-live="polite" aria-atomic="true"></div>
    <div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>
    <div class="save-status" id="save-status">Guardado ✔</div>
  </div>
</body>
</html>
