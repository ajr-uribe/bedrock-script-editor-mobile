<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta property="og:title" content="MCBE Script Editor" />
  <meta property="og:description" content="Minecraft bedrock Editor for easily making Scripts with auto-completions" />
  <meta property="og:image" content="https://res.cloudinary.com/dchi3dtvc/image/upload/favicon_xngegt.png" />
  <meta property="og:url" content="https://ajr-uribe-editor.vercel.app" />
  <meta property="og:type" content="website" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="./icons/favicon.png" />
  <meta name="theme-color" content="#2b2f34" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MCBE Scripts Editor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button
    class="min-toolbar-btn"
    id="min-btn"
    aria-label="Minimize toolbar"
    title="Minimize toolbar"
  >🧩 Close Toolbar 🧩</button>

  <main id="app" role="main" aria-label="Editor principal">
    <header id="header">
      <h1>
        <img src="./icons/favicon.png" alt="MCBE Editor logo" id="icon" />
        Bedrock Scripts Editor
      </h1>
      <div id="toolbar" role="region" aria-label="Barra de herramientas">
        <select id="module-select" aria-label="Seleccionar módulo">
          <option value="server">@minecraft/server</option>
          <option value="server-ui">@minecraft/server-ui</option>
          <option value="server-gametest">@minecraft/server-gametest</option>
        </select>

        <input
          id="version-input"
          type="text"
          placeholder="e.g. 2.0.0"
          value="2.0.0"
          aria-label="Versión del módulo"
        />

        <button id="load-types-btn" aria-label="Cargar definiciones de tipos">
          Cargar Tipos
        </button>

        <button id="run-btn" aria-label="Ejecutar acción (próximamente)">
          Execute (Soon)
        </button>

        <button id="copy-btn" aria-label="Copiar código">
          Copy
        </button>

        <input
          type="text"
          id="filename-input"
          placeholder="File Name"
          value="main"
          aria-label="Nombre del archivo"
        />

        <button id="download-btn" aria-label="Descargar código">
          Download
        </button>

        <button id="install-btn" aria-label="Instalar aplicación">
          Install
        </button>

        <button id="reset-btn" aria-label="Resetear editor">
          Reset Editor
        </button>
      </div>
    </header>

    <section id="editor-container">
      <div id="monaco-editor" aria-label="Editor de código"></div>
    </section>

    <div class="status-bar" id="status-bar" aria-live="polite" aria-atomic="true">
      Loading editor...
      <div id="save-status" class="save-status" role="status" aria-live="polite">
        Saving...
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs/loader.min.js"></script>
  <script src="/js/main.js" defer></script>
</body>
</html>
