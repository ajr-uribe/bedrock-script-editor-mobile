		<meta

		<meta

			rel="canonical"

			rel="preload"

			href="/assets/js/main.js"

		<!-- CSS crítico para first paint -->
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				background: #000;
				color: #fff;
				overflow: hidden;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100dvh;
			}

			.loading-screen {
				width: 100%;
				height: 100vh;
				background: linear-gradient(135deg, #0f0f1a 0%, #000000 100%);
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				position: fixed;
				z-index: 9999;
			}

			.logo {
				margin-bottom: 2rem;
				font-size: 2.5rem;
				font-weight: 800;
				color: transparent;
				background: linear-gradient(45deg, #6c5ce7, #00cec9, #0984e3);
				-webkit-background-clip: text;
				background-clip: text;
				text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
			}

			.loading-text {
				font-size: 2.2rem;
				margin-bottom: 2.5rem;
				font-weight: 300;
				letter-spacing: 2px;
				color: #f5f5f5;
				text-align: center;
				display: flex;
				justify-content: center;
				align-items: center;
				position: relative;
			}

			/* Efecto de texto neón mejorado */
			.loading-text span {
				color: #fff;
				text-shadow:
					0 0 5px rgba(255, 255, 255, 0.8),
					0 0 10px rgba(108, 92, 231, 0.5),
					0 0 15px rgba(108, 92, 231, 0.3),
					0 0 20px rgba(108, 92, 231, 0.2);
				animation: pulse 2s ease-in-out infinite alternate;
			}

			@keyframes pulse {
				from {
					text-shadow:
						0 0 5px rgba(255, 255, 255, 0.8),
						0 0 10px rgba(108, 92, 231, 0.5),
						0 0 15px rgba(108, 92, 231, 0.3),
						0 0 20px rgba(108, 92, 231, 0.2);
				}
				to {
					text-shadow:
						0 0 7px rgba(255, 255, 255, 0.9),
						0 0 14px rgba(108, 92, 231, 0.6),
						0 0 20px rgba(108, 92, 231, 0.4),
						0 0 25px rgba(108, 92, 231, 0.3);
				}
			}

			.loading-dots {
				display: inline-block;
				width: 40px;
				text-align: left;
			}

			.loading-dots::after {
				content: "";
				animation: dots 1.5s infinite;
			}

			@keyframes dots {
				0%,
				20% {
					content: ".";
				}
				40% {
					content: "..";
				}
				60%,
				100% {
					content: "...";
				}
			}

			.container {
				--uib-size: 40px;
				--uib-color: #6c5ce7;
				--uib-speed: 1s;
				--uib-stroke: 4px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				width: var(--uib-size);
				height: calc(var(--uib-size) * 0.9);
				margin-bottom: 1.5rem;
			}

			.bar {
				width: var(--uib-stroke);
				height: 100%;
				background-color: var(--uib-color);
				border-radius: 50px;
				transition: background-color 0.3s ease;
				box-shadow: 0 0 10px rgba(108, 92, 231, 0.8);
			}

			.bar:nth-child(1) {
				animation: grow var(--uib-speed) ease-in-out
					calc(var(--uib-speed) * -0.45) infinite;
			}

			.bar:nth-child(2) {
				animation: grow var(--uib-speed) ease-in-out
					calc(var(--uib-speed) * -0.3) infinite;
			}

			.bar:nth-child(3) {
				animation: grow var(--uib-speed) ease-in-out
					calc(var(--uib-speed) * -0.15) infinite;
			}

			.bar:nth-child(4) {
				animation: grow var(--uib-speed) ease-in-out infinite;
			}

			@keyframes grow {
				0%,
				100% {
					transform: scaleY(0.3);
				}

				50% {
					transform: scaleY(1);
				}
			}

			.progress-text {
				font-size: 0.9rem;
				color: #a0a0a0;
				margin-top: 1rem;
				text-align: center;
				max-width: 300px;
				line-height: 1.5;
			}

			.loader-content {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 2rem;
				border-radius: 15px;
				background: rgba(20, 20, 30, 0.7);
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
				backdrop-filter: blur(5px);
				border: 1px solid rgba(108, 92, 231, 0.3);
			}
		</style>
		<link
			rel="stylesheet"
			href="/assets/css/style.css" />
	</head>

	<body>
		<div
			class="loading-screen"
			id="loading-screen">
			<div class="loader-content">
				<div class="logo">MCBEDITOR v2</div>

				<div class="loading-text">
					<span>Cargando</span><span class="loading-dots"></span>
				</div>

				<div class="container">
					<div class="bar"></div>
					<div class="bar"></div>
					<div class="bar"></div>
					<div class="bar"></div>
				</div>

				<div class="progress-text">
					Inicializando entorno de desarrollo...
				</div>
			</div>
		</div>

		<div class="app">
			<header>
				<nav>
					<button id="config-btn">⚙️│Config</button>
					<button id="debug-btn">🔍│Debug</button>
				</nav>
				<div
					class="tabs"
					id="tabs-container">
					<div
						class="add-tab"
						id="add-tab">
						+
					</div>
				</div>
			</header>
			<div class="editor-container">
				<div
					id="editor"
					class="editor"></div>
			</div>
		</div>

		<div
			class="form"
			id="config-form">
			<div class="form-container">
				<div class="form-header">
					<h2 class="form-title">Configuración del Editor</h2>
					<button
						class="close-btn"
						id="close-form">
						&times;
					</button>
				</div>
				<form id="settings-form">
					<div class="form-group">
						<label
							class="form-label"
							for="username"
							>Nombre de usuario</label
						>
						<input
							class="form-input"
							type="text"
							id="username"
							name="username"
							required />
					</div>

					<div class="form-group">
						<label
							class="form-label"
							for="email"
							>Correo electrónico</label
						>
						<input
							class="form-input"
							type="email"
							id="email"
							name="email"
							required />
					</div>

					<div class="form-group">
						<label
							class="form-label"
							for="theme"
							>Tema del Editor</label
						>
						<select
							class="form-select"
							id="theme"
							name="theme">
							<option value="dark">Oscuro</option>
							<option value="light">Claro</option>
						</select>
					</div>

					<div class="form-group">
						<label
							class="form-label"
							for="font-size"
							>Tamaño de Fuente</label
						>
						<input
							class="form-input"
							type="number"
							id="font-size"
							name="fontSize"
							min="10"
							max="24"
							value="14" />
					</div>

					<div class="form-group">
						<label
							class="form-label"
							for="tab-size"
							>Tamaño de Tabulación</label
						>
						<input
							class="form-input"
							type="number"
							id="tab-size"
							name="tabSize"
							min="2"
							max="8"
							value="4" />
					</div>

					<div class="checkbox-group">
						<input
							class="form-checkbox"
							type="checkbox"
							id="line-numbers"
							name="lineNumbers"
							checked />
						<label
							class="checkbox-label"
							for="line-numbers"
							>Mostrar números de línea</label
						>
					</div>

					<div class="checkbox-group">
						<input
							class="form-checkbox"
							type="checkbox"
							id="word-wrap"
							name="wordWrap" />
						<label
							class="checkbox-label"
							for="word-wrap"
							>Ajuste de línea</label
						>
					</div>

					<div class="checkbox-group">
						<input
							class="form-checkbox"
							type="checkbox"
							id="auto-save"
							name="autoSave"
							checked />
						<label
							class="checkbox-label"
							for="auto-save"
							>Guardado automático</label
						>
					</div>

					<div class="form-group">
						<label
							class="form-label"
							for="auto-save-interval"
							>Intervalo de autoguardado (minutos)</label
						>
						<input
							class="form-input"
							type="number"
							id="auto-save-interval"
							name="autoSaveInterval"
							min="1"
							max="60"
							value="5" />
					</div>

					<div class="form-group">
						<h4
							style="
								color: #fff;
								margin: 20px 0 10px 0;
								border-bottom: 1px solid #444;
								padding-bottom: 5px;
							">
							Formateo de Código
						</h4>
					</div>

					<div class="checkbox-group">
						<input
							class="form-checkbox"
							type="checkbox"
							id="format-on-type"
							name="formatOnType" />
						<label
							class="checkbox-label"
							for="format-on-type"
							>Formatear mientras escribes</label
						>
					</div>

					<div class="checkbox-group">
						<input
							class="form-checkbox"
							type="checkbox"
							id="format-on-paste"
							name="formatOnPaste" />
						<label
							class="checkbox-label"
							for="format-on-paste"
							>Formatear al pegar código</label
						>
					</div>

					<!-- Sección de Autocompletado -->
					<div class="form-group">
						<h4
							style="
								color: #fff;
								margin: 20px 0 10px 0;
								border-bottom: 1px solid #444;
								padding-bottom: 5px;
							">
							Autocompletado
						</h4>
					</div>

					<div class="checkbox-group">
						<input
							class="form-checkbox"
							type="checkbox"
							id="enable-preview"
							name="enablePreview"
							checked />
						<label
							class="checkbox-label"
							for="enable-preview"
							>Vista previa de sugerencias</label
						>
					</div>

					<div class="checkbox-group">
						<input
							class="form-checkbox"
							type="checkbox"
							id="show-methods"
							name="showMethods"
							checked />
						<label
							class="checkbox-label"
							for="show-methods"
							>Mostrar métodos</label
						>
					</div>

					<div class="checkbox-group">
						<input
							class="form-checkbox"
							type="checkbox"
							id="show-keywords"
							name="showKeywords"
							checked />
						<label
							class="checkbox-label"
							for="show-keywords"
							>Mostrar palabras clave</label
						>
					</div>

					<div class="form-group">
						<label
							class="form-label"
							for="hover-delay"
							>Retraso del hover (ms)</label
						>
						<input
							class="form-input"
							type="number"
							id="hover-delay"
							name="hoverDelay"
							min="0"
							max="1000"
							value="300"
							step="50" />
					</div>

					<!-- Sección de Comportamiento -->
					<div class="form-group">
						<h4
							style="
								color: #fff;
								margin: 20px 0 10px 0;
								border-bottom: 1px solid #444;
								padding-bottom: 5px;
							">
							Comportamiento del Editor
						</h4>
					</div>

					<div class="checkbox-group">
						<input
							class="form-checkbox"
							type="checkbox"
							id="smooth-cursor"
							name="smoothCursor" />
						<label
							class="checkbox-label"
							for="smooth-cursor"
							>Animación suave del cursor</label
						>
					</div>

					<div class="checkbox-group">
						<input
							class="form-checkbox"
							type="checkbox"
							id="mouse-wheel-zoom"
							name="mouseWheelZoom" />
						<label
							class="checkbox-label"
							for="mouse-wheel-zoom"
							>Zoom con rueda del mouse</label
						>
					</div>

					<div class="checkbox-group">
						<input
							class="form-checkbox"
							type="checkbox"
							id="smooth-scrolling"
							name="smoothScrolling" />
						<label
							class="checkbox-label"
							for="smooth-scrolling"
							>Desplazamiento suave</label
						>
					</div>

					<div class="form-group">
						<label
							class="form-label"
							for="cursor-blinking"
							>Estilo del cursor</label
						>
						<select
							class="form-select"
							id="cursor-blinking"
							name="cursorBlinking">
							<option value="blink">Parpadeante</option>
							<option value="smooth">Suave</option>
							<option value="phase">Fase</option>
							<option value="expand">Expandir</option>
							<option value="solid">Sólido</option>
						</select>
					</div>

					<!-- Sección de Validación -->
					<div class="form-group">
						<h4
							style="
								color: #fff;
								margin: 20px 0 10px 0;
								border-bottom: 1px solid #444;
								padding-bottom: 5px;
							">
							Validación de Código
						</h4>
					</div>

					<div class="checkbox-group">
						<input
							class="form-checkbox"
							type="checkbox"
							id="semantic-validation"
							name="semanticValidation"
							checked />
						<label
							class="checkbox-label"
							for="semantic-validation"
							>Validación semántica</label
						>
					</div>

					<div class="checkbox-group">
						<input
							class="form-checkbox"
							type="checkbox"
							id="syntax-validation"
							name="syntaxValidation"
							checked />
						<label
							class="checkbox-label"
							for="syntax-validation"
							>Validación de sintaxis</label
						>
					</div>

					<div class="checkbox-group">
						<input
							class="form-checkbox"
							type="checkbox"
							id="suggestion-diagnostics"
							name="suggestionDiagnostics"
							checked />
						<label
							class="checkbox-label"
							for="suggestion-diagnostics"
							>Sugerencias de diagnóstico</label
						>
					</div>
					<div class="form-buttons">
						<button
							type="button"
							class="btn btn-secondary"
							id="cancel-btn">
							Cancelar
						</button>
						<button
							type="button"
							class="btn btn-danger"
							id="reset-btn">
							Restablecer
						</button>
						<button
							type="submit"
							class="btn btn-primary"
							id="apply-btn">
							Guardar Configuración
						</button>
					</div>
				</form>
			</div>
		</div>

		<div
			class="form"
			id="fileName-form">
			<div class="form-container">
				<input
					type="text"
					class="form-input"
					id="filename-input"
					placeholder="Nombre del archivo con extensión: name.js"
					required />
				<button
					type="submit"
					id="crear-con-nombre"
					class="btn-primary">
					Crear
				</button>
				<button
					id="close-fileName-form"
					class="btn-danger">
					Cancelar
				</button>
			</div>
		</div>

		<!-- JavaScript diferido -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.js"></script>
		<script
			src="/assets/js/main.js"
			type="module"></script>
	</body>
</html>
