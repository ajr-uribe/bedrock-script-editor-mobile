<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCBE Script Editor</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="./icons/favicon.png">
    <meta name="theme-color" content="#007acc">
</head>
<body>
    <div id="app">
        <div id="header">
            <h1>Bedrock Scripts Editor</h1>
            <div id="toolbar">
                <select id="module-select">
                    <option value="server">@minecraft/server</option>
                    <option value="server-ui">@minecraft/server-ui</option>
                    <option value="server-gametest">@minecraft/server-gametest</option>
                </select>
                <button id="run-btn">Execute</button>
                <button id="debug-btn">Debug</button>
                <button id="copy-btn">Copy</button>
                <button id="install-btn">
                    <span id="install-text">Install App</span>
                </button>
            </div>
        </div>
        <div id="editor-container">
            <div id="monaco-editor"></div>
        </div>
        <div id="debug-panel" style="display:none;">
            <div class="debug-toolbar">
                <button id="run-debug">Execute</button>
                <button id="clear-console">Clear</button>
                <button id="close-debug">Close</button>
            </div>
            <div id="debug-console"></div>
            <div id="world-state-viewer"></div>
        </div>
        <div class="status-bar" id="status-bar"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs/loader.min.js"></script>
    <script src="js/debugger.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
