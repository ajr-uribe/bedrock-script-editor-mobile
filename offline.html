<!DOCTYPE html>
<html>
<head>
    <title>Modo Offline</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #1e1e1e; 
            color: white; 
            text-align: center; 
            padding: 50px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }
        #offline-text {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="offline-text">
    <h1 class="titulo-offline">Estás trabajando offline</h1>
    <p class="alerta-offline">Algunas funciones pueden no estar disponibles</p>
    <button onclick="window.location.reload()">Reintentar conexión</button>
    </div>
</body>
</html>
